<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="Kindgerechte Lern-App für das kleine 1×1 und Geteiltaufgaben mit Spaced Repetition"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="1×1 Meister" />
    <link rel="icon" type="image/png" href="./pwa/penguin-192.png" />
    <link rel="apple-touch-icon" href="./pwa/penguin-180.png" />
    <link rel="manifest" href="./manifest-penguin.webmanifest" />
    <title>1×1 Meister – Kleines Einmaleins lernen</title>
    <script>
      try {
        var savedLogo = localStorage.getItem('einmaleins_logo_v1');
        var validLogos = ['penguin', 'otter', 'owl', 'rocket', 'fox'];
        if (savedLogo && validLogos.indexOf(savedLogo) !== -1) {
          var iconEl = document.querySelector('link[rel="icon"]');
          if (iconEl) iconEl.href = './pwa/' + savedLogo + '-192.png';
          var touchEl = document.querySelector('link[rel="apple-touch-icon"]');
          if (touchEl) touchEl.href = './pwa/' + savedLogo + '-180.png';
          var manifestEl = document.querySelector('link[rel="manifest"]');
          if (manifestEl) manifestEl.href = './manifest-' + savedLogo + '.webmanifest';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
