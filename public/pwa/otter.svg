  <circle cx="51" cy="54" r="11" fill="url(#gCream_otter)" />
  <circle cx="69" cy="54" r="11" fill="url(#gCream_otter)" />
  <!-- Schnurrhaare -->
  <line x1="28" y1="52" x2="41" y2="53" stroke="url(#gCream_otter)" stroke-width="2" stroke-linecap="round" />
  <line x1="29" y1="57" x2="41" y2="56" stroke="url(#gCream_otter)" stroke-width="2" stroke-linecap="round" />
  <line x1="92" y1="52" x2="79" y2="53" stroke="url(#gCream_otter)" stroke-width="2" stroke-linecap="round" />
  <line x1="91" y1="57" x2="79" y2="56" stroke="url(#gCream_otter)" stroke-width="2" stroke-linecap="round" />
  <!-- Augen -->
  <circle cx="44" cy="40" r="5.8" fill="url(#gDark_otter)" />
  <circle cx="76" cy="40" r="5.8" fill="url(#gDark_otter)" />
  <circle cx="46" cy="38" r="2" fill="url(#gWhite_otter)" />
  <circle cx="78" cy="38" r="2" fill="url(#gWhite_otter)" />
