  <path d="M53 46C56 44 64 44 67 46L60 53Z" fill="url(#gDark_otter)" />
  <path d="M60 53V58M60 58C56 61 52 60 50 58M60 58C64 61 68 60 70 58" stroke="url(#gDark_otter)" stroke-width="2.2" stroke-linecap="round" />
