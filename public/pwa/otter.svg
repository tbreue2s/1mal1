  <circle cx="34" cy="82" r="6" fill="url(#otterFur)" />
  <circle cx="86" cy="82" r="6" fill="url(#otterFur)" />
  <text x="60" y="88" text-anchor="middle" font-family="DejaVu Sans" font-weight="900" font-size="18" fill="url(#gDark_otter)">1×1</text>
